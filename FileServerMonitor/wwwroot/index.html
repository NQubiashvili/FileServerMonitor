<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Folder Activity Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://rsms.me/inter/inter.css" rel="stylesheet">
    <style>

        body {
            font-family: 'Inter', sans-serif;
        }

        .table-cell {
            padding: 0.75rem;
            vertical-align: top;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.875rem;
        }

        .action-chip {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-created {
            background-color: #dcfce7;
            color: #166534;
        }

        .action-deleted {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .action-modified {
            background-color: #fef3c7;
            color: #92400e;
        }

        .action-renamed {
            background-color: #dbeafe;
            color: #1e40af;
        }

        #searchInput {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            width: 100%;
            max-width: 400px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Shared Folder Activity Log</h1>
                <p class="text-gray-600 mt-1">Real-time events from the monitored folder.</p>
            </div>
            <button id="refreshBtn" class="bg-blue-600 text-white font-semibold py-2 px-5 rounded-lg shadow hover:bg-blue-700 transition-colors duration-200 flex items-center">
                <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise mr-2" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
                </svg>
                <span id="refresh-text">Refresh</span>
            </button>
        </header>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-6" role="alert">
            <strong class="font-bold">Connection Error!</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>

        <input type="text" id="searchInput" placeholder="Search logs...">

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="table-cell text-left text-gray-600">Timestamp</th>
                            <th class="table-cell text-left text-gray-600">Action</th>
                            <th class="table-cell text-left text-gray-600">Path Details</th>
                            <th class="table-cell text-left text-gray-600">PC Name</th>
                            <th class="table-cell text-left text-gray-600">IP</th>
                            <th class="table-cell text-left text-gray-600">User</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body"></tbody>
                </table>
                <div id="loading" class="p-8 text-center text-gray-500">Loading initial logs...</div>
            </div>
            <div id="pagination" class="flex justify-center mt-4 flex-wrap"></div>
        </div>
    </div>

    <script>
        const logTableBody = document.getElementById('log-table-body');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshIcon = document.getElementById('refresh-icon');
        const refreshText = document.getElementById('refresh-text');
        const loadingDiv = document.getElementById('loading');
        const errorMessageDiv = document.getElementById('error-message');
        const errorTextSpan = document.getElementById('error-text');
        const paginationDiv = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const apiUrl = '/api/logs';

        const logsPerPage = 20;
        let currentPage = 1;
        let allLogs = [];
        let filteredLogs = [];

        // render action chip
        function getActionChip(action) {
            if (!action) return `<span class="action-chip bg-gray-200 text-gray-700">Unknown</span>`;

            const lower = action.toLowerCase();
            let cls = '';

            switch (lower) {
                case 'read (open)':
                case 'execute/open':
                    cls = 'bg-green-100 text-green-800';   // Open
                    break;
                case 'write (modify)':
                case 'append (modify)':
                    cls = 'bg-yellow-100 text-yellow-800'; // Modify
                    break;
                case 'delete':
                case 'delete child':
                    cls = 'bg-red-100 text-red-800';       // Delete
                    break;
                case 'rename':
                    cls = 'bg-blue-100 text-blue-800';     // Rename
                    break;
                case 'move':
                    cls = 'bg-purple-100 text-purple-800'; // Close
                    break;
                default:
                    cls = 'bg-gray-200 text-gray-700';      // fallback / unknown
            }

            return `<span class="action-chip ${cls}">${action}</span>`;
        }


        // render table for current page
        function renderTablePage(page) {
            logTableBody.innerHTML = '';
            const start = (page - 1) * logsPerPage;
            const end = start + logsPerPage;
            const pageLogs = filteredLogs.slice(start, end);

            pageLogs.forEach(log => {
                const row = document.createElement('tr');
                let pathDetails = `<div class="font-mono text-sm break-all">${log.fullPath}</div>`;
                if ((log.action.toLowerCase() === 'rename' || log.action.toLowerCase() === 'move') && log.oldFullPath) {
                    pathDetails = `
            <div class="text-sm"><span class="text-gray-500">From:</span> <span class="font-mono break-all">${log.oldFullPath}</span></div>
            <div class="text-sm mt-1"><span class="text-gray-500">To:</span> <span class="font-mono break-all text-blue-600">${log.fullPath}</span></div>
        `;
                }
                row.innerHTML = `
                    <td class="table-cell text-gray-500 font-mono text-xs">${log.timestamp}</td>
                    <td class="table-cell">${getActionChip(log.action)}</td>
                    <td class="table-cell">${pathDetails}</td>
                    <td class="table-cell">${log.pcName || '-'}</td>
                    <td class="table-cell">${log.ipAddress || '-'}</td>
                    <td class="table-cell">${log.userName || '-'}</td>
                `;
                logTableBody.appendChild(row);
            });

            renderPaginationControls();
        }

        // pagination buttons
        function renderPaginationControls() {
            paginationDiv.innerHTML = '';
            const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
            if (totalPages <= 1) return;

            const createBtn = (text, disabled = false, active = false, onClick = null) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.disabled = disabled;
                btn.className = `px-3 py-1 rounded mx-1 border border-gray-300 hover:bg-gray-200 ${active ? 'bg-blue-600 text-white' : ''} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
                if (onClick) btn.onclick = onClick;
                return btn;
            };

            paginationDiv.appendChild(createBtn('Prev', currentPage === 1, false, () => { currentPage--; renderTablePage(currentPage); }));
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                paginationDiv.appendChild(createBtn(i, false, i === currentPage, () => { currentPage = i; renderTablePage(currentPage); }));
            }
            paginationDiv.appendChild(createBtn('Next', currentPage === totalPages, false, () => { currentPage++; renderTablePage(currentPage); }));
        }

        // search across all logs
        function applySearchFilter() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) {
                filteredLogs = [...allLogs]; // show all if query empty
            } else {
                filteredLogs = allLogs.filter(log =>
                    (log.timestamp && log.timestamp.toLowerCase().includes(q)) ||
                    (log.action && log.action.toLowerCase().includes(q)) ||
                    (log.fullPath && log.fullPath.toLowerCase().includes(q)) ||
                    (log.oldFullPath && log.oldFullPath.toLowerCase().includes(q)) ||
                    (log.pcName && log.pcName.toLowerCase().includes(q)) ||
                    (log.ipAddress && log.ipAddress.toLowerCase().includes(q)) ||
                    (log.userName && log.userName.toLowerCase().includes(q)) ||
                    (log.domain && log.domain.toLowerCase().includes(q))
                );
            }
            currentPage = 1;
            renderTablePage(currentPage);
        }

        searchInput.addEventListener('input', applySearchFilter);

        // fetch logs from API
        async function fetchLogs() {
            refreshText.textContent = 'Refreshing...';
            refreshIcon.classList.add('animate-spin');
            errorMessageDiv.classList.add('hidden');

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`Server responded with status: ${response.status}`);
                allLogs = await response.json();

                if (allLogs.length === 0) {
                    loadingDiv.textContent = 'No log entries found. Perform an action in the monitored folder.';
                    loadingDiv.classList.remove('hidden');
                    filteredLogs = [];
                } else {
                    loadingDiv.classList.add('hidden');
                    filteredLogs = [...allLogs]; // make a copy for filtering
                    currentPage = 1;
                    renderTablePage(currentPage);
                }
            } catch (error) {
                console.error('Failed to fetch logs:', error);
                errorTextSpan.textContent = `Could not fetch data from ${apiUrl}. Details: ${error.message}`;
                errorMessageDiv.classList.remove('hidden');
                loadingDiv.textContent = 'Failed to load data.';
            } finally {
                refreshText.textContent = 'Refresh';
                refreshIcon.classList.remove('animate-spin');
            }
        }

        refreshBtn.addEventListener('click', fetchLogs);
        fetchLogs();
        setInterval(fetchLogs, 30000); // refresh every 30 sec
    </script>
</body>
</html>
